server:
  port: 8000

spring:
  application:
    name: tally-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tally}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

tally:
  jwt:
    secret: ${JWT_SECRET:change_me_in_production}
    algorithm: ${JWT_ALGORITHM:HS256}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  plaid:
    env: ${PLAID_ENV:sandbox}
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    token-encryption-key: ${PLAID_TOKEN_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
