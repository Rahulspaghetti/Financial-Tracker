[project]
name = "tally-api"
version = "0.1.0"
description = "Tally personal finance API — FastAPI backend"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Tally" }
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
