<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-canvas); }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .specimen { font-family: var(--font-display); font-weight: 400; color: var(--fg-1); line-height: 1; letter-spacing: -0.03em; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
</style></head>
<body>
  <div class="stack">
    <div class="meta">Display · Instrument Serif · 400</div>
    <div class="row">
      <div class="specimen" style="font-size: 80px;">Money,</div>
      <div class="specimen" style="font-size: 80px; font-style: italic; color: var(--accent);">understood.</div>
    </div>
    <div class="row" style="gap: 24px; margin-top: 4px;">
      <div class="specimen" style="font-size: 32px;">$1,284.50</div>
      <div class="specimen" style="font-size: 32px; font-style: italic; color: var(--fg-2);">your spending</div>
    </div>
  </div>
</body></html>
