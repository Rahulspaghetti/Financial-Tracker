<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-canvas); display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--accent-soft); border: 1px solid var(--border-default); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .px { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); }
  .pill { width: 100px; height: 36px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--fg-onAccent); font-family: var(--font-body); font-size: 13px; font-weight: 500; }
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:4px;"></div><div class="name">xs</div><div class="px">4 px</div></div>
  <div class="item"><div class="box" style="border-radius:8px;"></div><div class="name">sm</div><div class="px">8 px · button</div></div>
  <div class="item"><div class="box" style="border-radius:12px;"></div><div class="name">md</div><div class="px">12 px</div></div>
  <div class="item"><div class="box" style="border-radius:16px;"></div><div class="name">lg</div><div class="px">16 px · card</div></div>
  <div class="item"><div class="box" style="border-radius:24px;"></div><div class="name">xl</div><div class="px">24 px · modal</div></div>
  <div class="item"><div class="pill" style="border-radius:9999px;"></div><div class="name">pill</div><div class="px">chip / avatar</div></div>
</body></html>
