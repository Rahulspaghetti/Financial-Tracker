<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-canvas); display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch { width: 124px; }
  .chip { width: 100%; height: 78px; border-radius: 14px; border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--fg-1); margin-top: 8px; }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 2px; }
</style></head>
<body>
  <div class="swatch"><div class="chip" style="background:#FAF7F2;"></div><div class="name">Canvas</div><div class="hex">#FAF7F2</div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF;"></div><div class="name">Raised</div><div class="hex">#FFFFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#F2EDE4;"></div><div class="name">Sunken</div><div class="hex">#F2EDE4</div></div>
  <div class="swatch"><div class="chip" style="background:#1F4D3F;"></div><div class="name" style="color:var(--fg-1);">Accent</div><div class="hex">#1F4D3F</div></div>
  <div class="swatch"><div class="chip" style="background:#E4ECE7;"></div><div class="name">Accent soft</div><div class="hex">#E4ECE7</div></div>
  <div class="swatch"><div class="chip" style="background:#14171A;"></div><div class="name">Ink 900</div><div class="hex">#14171A</div></div>
</body></html>
