<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-canvas); }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 12px; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; min-width: 110px; }
  .sample { font-family: var(--font-body); color: var(--fg-1); }
  .header { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
</style></head>
<body>
  <div class="header">Body · Geist</div>
  <div class="stack">
    <div class="row"><div class="meta">300 · 17px</div><div class="sample" style="font-weight: 300; font-size: 17px;">Connect an account to get started.</div></div>
    <div class="row"><div class="meta">400 · 15px</div><div class="sample" style="font-weight: 400; font-size: 15px;">You spent $312 on groceries this month — about 8% less than April.</div></div>
    <div class="row"><div class="meta">500 · 15px</div><div class="sample" style="font-weight: 500; font-size: 15px;">Recent transactions</div></div>
    <div class="row"><div class="meta">600 · 20px</div><div class="sample" style="font-weight: 600; font-size: 20px; letter-spacing: -0.01em;">Your spending in motion</div></div>
    <div class="row"><div class="meta">500 · 13px</div><div class="sample" style="font-weight: 500; font-size: 13px; color: var(--fg-2);">Chase ·· 4421 · 3 hours ago</div></div>
    <div class="row"><div class="meta">500 · 11px ⌃</div><div class="sample" style="font-weight: 500; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-2);">Pending charges</div></div>
  </div>
</body></html>
