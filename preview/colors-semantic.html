<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-canvas); display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .cell { border-radius: 14px; padding: 14px 16px; min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: var(--font-body); font-weight: 500; font-size: 13px; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .lbl  { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
</style></head>
<body>
  <div class="cell" style="background:#4A7C59; color:#FAF7F2;">
    <div class="lbl">Positive</div>
    <div><div class="name">Income</div><div class="hex">#4A7C59</div></div>
  </div>
  <div class="cell" style="background:#B14B3A; color:#FAF7F2;">
    <div class="lbl">Negative</div>
    <div><div class="name">Expense</div><div class="hex">#B14B3A</div></div>
  </div>
  <div class="cell" style="background:#A87C2F; color:#FAF7F2;">
    <div class="lbl">Caution</div>
    <div><div class="name">Pending</div><div class="hex">#A87C2F</div></div>
  </div>
  <div class="cell" style="background:#3C5A7A; color:#FAF7F2;">
    <div class="lbl">Info</div>
    <div><div class="name">Link / note</div><div class="hex">#3C5A7A</div></div>
  </div>
  <div class="cell" style="background:#E8EFE8; color:#1F4D3F;">
    <div class="lbl">+ soft</div>
    <div><div class="name">Income tint</div><div class="hex">#E8EFE8</div></div>
  </div>
  <div class="cell" style="background:#F4E4DF; color:#7A2E22;">
    <div class="lbl">− soft</div>
    <div><div class="name">Expense tint</div><div class="hex">#F4E4DF</div></div>
  </div>
  <div class="cell" style="background:#F2EAD8; color:#5C4318;">
    <div class="lbl">⌁ soft</div>
    <div><div class="name">Caution tint</div><div class="hex">#F2EAD8</div></div>
  </div>
  <div class="cell" style="background:#E2E8EE; color:#1F324A;">
    <div class="lbl">i soft</div>
    <div><div class="name">Info tint</div><div class="hex">#E2E8EE</div></div>
  </div>
</body></html>
