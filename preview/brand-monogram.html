<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-canvas); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lbl { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .mono { width: 84px; height: 84px; }
  .small { width: 40px; height: 40px; }
</style></head>
<body>
  <div class="item">
    <img src="../assets/monogram.svg" alt="" class="mono"/>
    <span class="lbl">App icon · 84</span>
  </div>
  <div class="item">
    <img src="../assets/monogram.svg" alt="" class="small"/>
    <span class="lbl">Avatar · 40</span>
  </div>
  <div class="item">
    <img src="../assets/monogram-ink-on-cream.svg" alt="" class="mono"/>
    <span class="lbl">Inverse</span>
  </div>
  <div class="item" style="gap: 6px;">
    <div style="width: 84px; height: 84px; border-radius: 18px; background: var(--ink-900); display: flex; align-items: center; justify-content: center;">
      <img src="../assets/monogram.svg" alt="" style="width: 64px; height: 64px;"/>
    </div>
    <span class="lbl">On ink</span>
  </div>
  <div class="item" style="gap: 6px;">
    <div style="width: 84px; height: 84px; border-radius: 18px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center;">
      <img src="../assets/monogram.svg" alt="" style="width: 64px; height: 64px;"/>
    </div>
    <span class="lbl">On tint</span>
  </div>
</body></html>
