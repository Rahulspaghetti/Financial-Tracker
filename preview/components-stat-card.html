<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-canvas); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .num { font-family: var(--font-display); font-size: 38px; line-height: 1; color: var(--fg-1); letter-spacing: -0.02em; margin-top: 4px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
  .delta.up { color: var(--positive); }
  .delta.dn { color: var(--negative); }
  svg { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .spark { margin-top: 6px; height: 32px; width: 100%; }
</style></head>
<body>
  <div class="card">
    <span class="lbl">Spent in May</span>
    <span class="num">$2,140<span style="color: var(--fg-3); font-size: 22px;">.<span style="font-size: 18px;">28</span></span></span>
    <span class="delta dn"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M7 17l10-10M7 7h10v10"/></svg>+8.2% vs April</span>
  </div>
  <div class="card">
    <span class="lbl">Saved this month</span>
    <span class="num">$612<span style="color: var(--fg-3); font-size: 22px;">.<span style="font-size: 18px;">00</span></span></span>
    <span class="delta up"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7v10H7"/></svg>+22% vs April</span>
  </div>
  <div class="card" style="grid-column: span 2;">
    <span class="lbl">7-day spending</span>
    <svg class="spark" viewBox="0 0 600 60" preserveAspectRatio="none">
      <path d="M0,40 C50,20 80,52 130,38 C180,24 220,46 270,30 C320,14 360,40 410,22 C460,8 500,30 550,18 L600,22"
            stroke="#1F4D3F" stroke-width="2" fill="none"/>
      <path d="M0,40 C50,20 80,52 130,38 C180,24 220,46 270,30 C320,14 360,40 410,22 C460,8 500,30 550,18 L600,22 L600,60 L0,60 Z"
            fill="#E4ECE7" stroke="none"/>
    </svg>
  </div>
</body></html>
