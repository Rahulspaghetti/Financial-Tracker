<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-canvas); }
  .row { display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); height: 64px; }
  .cell { flex: 1; display: flex; align-items: flex-end; padding: 8px 10px; }
  .label { font-family: var(--font-mono); font-size: 10px; }
  .h { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 6px; }
  .h:first-child { margin-top: 0; }
</style></head>
<body>
  <div class="h">Ink scale · primary text → divider</div>
  <div class="row">
    <div class="cell" style="background:#14171A;"><span class="label" style="color:#FAF7F2;">900</span></div>
    <div class="cell" style="background:#2D3137;"><span class="label" style="color:#FAF7F2;">700</span></div>
    <div class="cell" style="background:#4A4F55;"><span class="label" style="color:#FAF7F2;">600</span></div>
    <div class="cell" style="background:#6B7178;"><span class="label" style="color:#FAF7F2;">500</span></div>
    <div class="cell" style="background:#878C92;"><span class="label" style="color:#FAF7F2;">400</span></div>
    <div class="cell" style="background:#B7BBBF;"><span class="label">300</span></div>
    <div class="cell" style="background:#D8DBDE;"><span class="label">200</span></div>
    <div class="cell" style="background:#E6E4DE;"><span class="label">100</span></div>
    <div class="cell" style="background:#EFEDE6;"><span class="label">050</span></div>
  </div>
</body></html>
