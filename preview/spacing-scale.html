<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-canvas); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 80px; }
  .bar { background: var(--accent); height: 14px; border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .h { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
</style></head>
<body>
  <div class="h">Spacing · 4px base grid</div>
  <div class="row"><span class="name">space-1</span><div class="bar" style="width:4px;"></div><span class="px">4 px</span></div>
  <div class="row"><span class="name">space-2</span><div class="bar" style="width:8px;"></div><span class="px">8 px</span></div>
  <div class="row"><span class="name">space-3</span><div class="bar" style="width:12px;"></div><span class="px">12 px</span></div>
  <div class="row"><span class="name">space-4</span><div class="bar" style="width:16px;"></div><span class="px">16 px · default gutter</span></div>
  <div class="row"><span class="name">space-6</span><div class="bar" style="width:24px;"></div><span class="px">24 px · card padding</span></div>
  <div class="row"><span class="name">space-8</span><div class="bar" style="width:32px;"></div><span class="px">32 px</span></div>
  <div class="row"><span class="name">space-12</span><div class="bar" style="width:48px;"></div><span class="px">48 px · section gap (web)</span></div>
  <div class="row"><span class="name">space-16</span><div class="bar" style="width:64px;"></div><span class="px">64 px</span></div>
</body></html>
