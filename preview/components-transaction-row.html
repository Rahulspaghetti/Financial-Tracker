<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface-canvas); }
  .list { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-sunken); }
  .icon { width: 36px; height: 36px; border-radius: 9999px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
  .icon.pos { background: var(--positive-soft); color: var(--positive); }
  .icon.neg { background: var(--negative-soft); color: var(--negative); }
  .body { flex: 1; min-width: 0; }
  .merch { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--fg-1); }
  .meta  { font-family: var(--font-body); font-size: 12px; color: var(--fg-3); margin-top: 2px; }
  .amt   { font-family: var(--font-mono); font-feature-settings: 'tnum' 1; font-weight: 500; font-size: 14px; }
  .amt.neg { color: var(--fg-1); }
  .amt.pos { color: var(--positive); }
  .amt.pending { color: var(--fg-3); font-style: italic; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <div class="list">
    <div class="row">
      <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 11l3-7h12l3 7M3 11v9a1 1 0 001 1h16a1 1 0 001-1v-9M3 11h18M8 16h.01M12 16h.01M16 16h.01"/></svg></div>
      <div class="body"><div class="merch">Whole Foods Market</div><div class="meta">Groceries · 2 hours ago</div></div>
      <div class="amt neg">−$84.21</div>
    </div>
    <div class="row">
      <div class="icon pos"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 17l-3-3m0 0l3-3m-3 3h12a4 4 0 100-8h-1"/></svg></div>
      <div class="body"><div class="merch">Direct deposit · Acme Inc</div><div class="meta">Paycheck · Today</div></div>
      <div class="amt pos">+$3,420.00</div>
    </div>
    <div class="row">
      <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg></div>
      <div class="body"><div class="merch">Spotify</div><div class="meta">Subscription · Yesterday</div></div>
      <div class="amt neg">−$10.99</div>
    </div>
    <div class="row">
      <div class="icon neg"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
      <div class="body"><div class="merch">Rent · May</div><div class="meta">Housing · May 1</div></div>
      <div class="amt pending">Pending · −$2,150</div>
    </div>
  </div>
</body></html>
