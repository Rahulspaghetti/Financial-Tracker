<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 0; background: var(--surface-canvas); display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 220px; }
  .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  .panel.cream { background: var(--surface-canvas); }
  .panel.ink   { background: var(--ink-900); }
  .panel.accent { background: var(--accent); }
  .lbl { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
  .panel.ink .lbl { color: rgba(250,247,242,0.5); }
  .panel.accent .lbl { color: rgba(250,247,242,0.6); }
  .word { font-family: 'Instrument Serif', serif; font-size: 56px; line-height: 1; letter-spacing: -1.5px; }
  .word.green { color: var(--accent); }
  .word.cream { color: var(--surface-canvas); }
  .tick { display: inline-block; width: 1.75px; height: 8px; background: currentColor; vertical-align: 24px; margin-left: -2px; border-radius: 1px; }
  .row { display: flex; align-items: baseline; }
</style></head>
<body>
  <div class="panel cream">
    <span class="lbl">On cream</span>
    <div class="row word green">Tally<span class="tick"></span></div>
  </div>
  <div class="panel ink">
    <span class="lbl">On ink</span>
    <div class="row word cream">Tally<span class="tick"></span></div>
  </div>
  <div class="panel accent">
    <span class="lbl">On accent</span>
    <div class="row word cream">Tally<span class="tick"></span></div>
  </div>
</body></html>
